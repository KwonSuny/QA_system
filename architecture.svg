<svg xmlns="http://www.w3.org/2000/svg" width="680" height="384" viewBox="0 0 680 384" role="img">
  <title>知识库问答系统架构</title>
  <desc>前端、后端、知识库服务、生成层与数据存储的分层架构及检索、生成与会话数据通路</desc>
  <rect width="680" height="384" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g stroke="#5F5E5A" stroke-width="1.5" fill="none">
    <path d="M180 76 L180 116" marker-end="url(#arrow)"/>
    <path d="M180 172 L180 212" marker-end="url(#arrow)"/>
    <path d="M180 268 L180 308" marker-end="url(#arrow)"/>
    <path d="M320 240 L400 240" marker-end="url(#arrow)"/>
    <path d="M520 212 L520 48 L320 48" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  </g>

  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" fill="#5F5E5A" font-size="11">
    <text x="188" y="192" dominant-baseline="central">检索 / 建库</text>
    <text x="188" y="288" dominant-baseline="central">向量读写 · 会话落库</text>
    <text x="360" y="254" text-anchor="middle" dominant-baseline="central">Top-K 上下文</text>
    <text x="425" y="40" dominant-baseline="central">SSE 流式输出</text>
  </g>

  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif">
    <rect x="40" y="20" width="280" height="56" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
    <text x="180" y="40" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">Web 客户端 · HTML/CSS/JS</text>
    <text x="180" y="60" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">注册登录 · 知识库 · 历史对话</text>

    <rect x="40" y="116" width="280" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
    <text x="180" y="136" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">FastAPI 后端 · server.py</text>
    <text x="180" y="156" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">认证鉴权 · 用户隔离 · 模型分流</text>

    <rect x="40" y="212" width="280" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="180" y="232" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">知识库服务 · kb_service.py</text>
    <text x="180" y="252" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">切分 · bge 嵌入 · Top-K 检索</text>

    <rect x="400" y="212" width="240" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
    <text x="520" y="232" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">生成层（本地 / 云端）</text>
    <text x="520" y="252" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Qwen2.5 · OpenAI 兼容 API</text>

    <rect x="40" y="308" width="280" height="56" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
    <text x="180" y="328" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">SQLite(app.db) + ChromaDB</text>
    <text x="180" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">会话消息配置 · 知识片段向量</text>
  </g>
</svg>
