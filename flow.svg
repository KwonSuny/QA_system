<svg xmlns="http://www.w3.org/2000/svg" width="680" height="236" viewBox="0 0 680 236" role="img">
  <title>核心流程：知识库构建流与问答流</title>
  <desc>构建流为文档切分向量化后写入向量库；问答流为提问向量化、检索 Top-K、组装提示词、模型生成、流式返回，两条流共用本地嵌入模型</desc>
  <rect width="680" height="236" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif">

    <text x="44" y="30" font-size="12" font-weight="500" fill="#0F6E56">知识库构建流</text>
    <g stroke="#888780" stroke-width="1.5" fill="none">
      <path d="M168 64 L200 64" marker-end="url(#arrow)"/>
      <path d="M324 64 L356 64" marker-end="url(#arrow)"/>
      <path d="M480 64 L512 64" marker-end="url(#arrow)"/>
    </g>
    <g>
      <rect x="44" y="46" width="124" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
      <text x="106" y="64" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">上传文档</text>
      <rect x="200" y="46" width="124" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
      <text x="262" y="64" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">文本切分</text>
      <rect x="356" y="46" width="124" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
      <text x="418" y="64" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">bge 向量化</text>
      <rect x="512" y="46" width="124" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
      <text x="574" y="64" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">写入向量库</text>
    </g>

    <text x="44" y="126" font-size="12" font-weight="500" fill="#185FA5">问答流</text>
    <g stroke="#888780" stroke-width="1.5" fill="none">
      <path d="M132 160 L146 160" marker-end="url(#arrow)"/>
      <path d="M234 160 L248 160" marker-end="url(#arrow)"/>
      <path d="M336 160 L350 160" marker-end="url(#arrow)"/>
      <path d="M438 160 L452 160" marker-end="url(#arrow)"/>
      <path d="M540 160 L554 160" marker-end="url(#arrow)"/>
    </g>
    <g>
      <rect x="44" y="142" width="88" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
      <text x="88" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">提问</text>
      <rect x="146" y="142" width="88" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
      <text x="190" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">向量化</text>
      <rect x="248" y="142" width="88" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
      <text x="292" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">检索 Top-K</text>
      <rect x="350" y="142" width="88" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
      <text x="394" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">组装 Prompt</text>
      <rect x="452" y="142" width="88" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
      <text x="496" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">模型生成</text>
      <rect x="554" y="142" width="88" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
      <text x="598" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">流式返回</text>
    </g>

    <path d="M418 82 L418 116 L292 116 L292 142" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
    <text x="440" y="112" font-size="11" fill="#5F5E5A">共用 bge 嵌入</text>

    <text x="340" y="214" text-anchor="middle" font-size="12" fill="#5F5E5A">检索与生成解耦：切换生成模型时无需重建向量库</text>
  </g>
</svg>
